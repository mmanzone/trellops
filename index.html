<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trellops - Trello Operational Dashboard</title>
    <link rel="icon" type="image/png" href="/powerupicon.png">
    <meta name="description" content="Trellops turns Trello boards into live dashboards, maps and weekly summaries your whole team can read at a glance.">
    <script>
        // Apply the saved theme before the first paint, so dark mode users don't
        // see a white flash while React loads. Mirrors DarkModeContext.
        (function () {
            try {
                var t = localStorage.getItem('dashboardTheme') || 'system';
                if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Instrument+Sans:wght@400..700&display=swap">
    <link rel="preconnect" href="https://fonts.cdnfonts.com">
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/digital-7-mono">
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
